services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - path: /opt/liga-pelada-oficial/backend.env
        format: raw
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app
      - supabase

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.coolify-oficial
      secrets:
        - public_build_env
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - path: /opt/liga-pelada-oficial/frontend.env
        format: raw
    environment:
      IDENTITY_BACKEND_URL: http://backend:3001
      NODE_OPTIONS: --max-http-header-size=65536
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      app:
      supabase:
      proxy:
        aliases:
          - liga-pelada-oficial-frontend

secrets:
  public_build_env:
    file: /opt/liga-pelada-oficial/public-build.env

networks:
  app:
  supabase:
    external: true
    name: liga-homologacao-supabase_default
  proxy:
    external: true
    name: coolify
