services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.coolify-oficial
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    volumes:
      - /opt/liga-pelada-oficial/backend.env:/run/liga/runtime.env:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app
      - supabase

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.coolify-oficial
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Configure a URL publica}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Configure a chave publica}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Configure a URL do aplicativo}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    volumes:
      - /opt/liga-pelada-oficial/frontend.env:/run/liga/runtime.env:ro
    environment:
      IDENTITY_BACKEND_URL: http://backend:3001
      NODE_OPTIONS: --max-http-header-size=65536
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      app:
      supabase:
      proxy:
        aliases:
          - liga-pelada-oficial-frontend

networks:
  app:
  supabase:
    external: true
    name: liga-homologacao-supabase_default
  proxy:
    external: true
    name: coolify
